app = "xwa-memgraph"
primary_region = "iad"

[build]
  image = "memgraph/memgraph:latest"

[env]
  MEMGRAPH_BOLT_PORT = "7687"

[[mounts]]
  source = "memgraph_data"
  destination = "/var/lib/memgraph"

[[services]]
  protocol = "tcp"
  internal_port = 7687

  [[services.ports]]
    port = 7687

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "30s"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
